version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - revive
    - gocritic
    - gosec
    - misspell
    - unconvert
    - prealloc
  settings:
    gosec:
      excludes:
        - G115
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      - linters:
          - revive
        text: "should have (a package )?comment"

formatters:
  enable:
    - gofmt
    - goimports